name: frontend-ci

on:
  pull_request:
    paths:
      - 'Cli-Proxy-API-Management-Center-main/**'
  push:
    branches:
      - main
    paths:
      - 'Cli-Proxy-API-Management-Center-main/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cli-Proxy-API-Management-Center-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run verify
